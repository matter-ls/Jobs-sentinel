name: Onboard new subscriber & send confirmation email

on:
  repository_dispatch:
    types: [onboard_subscriber]
  workflow_dispatch:
    inputs:
      name:
        description: "Candidate full name (e.g. Sofia Ramirez)"
        required: true
        type: string
      email:
        description: "Candidate email address"
        required: true
        type: string
      cv_text:
        description: "Candidate plain-text or Markdown CV"
        required: true
        type: string
      levels:
        description: "Comma-separated role levels (specialist,senior,manager,director,executive)"
        required: false
        default: "senior,manager"
        type: string
      domains:
        description: "Comma-separated broad job areas (operations,technology,project_product,sales_customer,strategy_process,finance_legal,people_hr,marketing,other)"
        required: false
        default: "other"
        type: string
      locations:
        description: "Comma-separated location IDs (jalisco,remote_mx,mx_country)"
        required: false
        default: "jalisco,remote_mx,mx_country"
        type: string
      language:
        description: "Daily briefing language"
        required: false
        default: "English"
        type: choice
        options:
          - English
          - Spanish
          - Portuguese
      free_text:
        description: "Free-text career goals, target industries & roles to exclude"
        required: false
        default: ""
        type: string
      send_initial_matches:
        description: "Also start the daily workflow for this subscriber right after the confirmation email"
        required: false
        default: false
        type: boolean

# Sign-ups have their own concurrency group, one per email address, separate from the daily
# refresh. GitHub keeps a single pending run per group, so when sign-ups shared the daily group
# a new sign-up could silently replace a waiting daily run or another waiting sign-up.
# Each sign-up writes only its own two files, so different people can be registered in parallel;
# two submissions for the same address still run one after the other.
concurrency:
  group: lucy-onboard-${{ github.event.client_payload.email || inputs.email || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  # Only used to start the daily workflow when "send_initial_matches" is ticked.
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Register subscriber, run tests, commit & push
        id: register
        env:
          PYTHONUNBUFFERED: "1"
          BRANCH: ${{ github.ref_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULT_JSON="${RUNNER_TEMP:-/tmp}/onboard_result.json"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

          done_as=""
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              echo "Syncing with origin/$BRANCH before retry #$attempt..."
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fdq -- subscribers cvs
            fi

            # The registration runs again on every attempt, on the freshly synced checkout, so
            # the subscriber id is always derived from what is really on the branch. Nothing is
            # ever copied back from an earlier attempt.
            python3 onboard_subscriber.py \
              --from-event "$GITHUB_EVENT_PATH" \
              --no-email \
              --result-out "$RESULT_JSON"
            SUB_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["subscriber_id"])' "$RESULT_JSON")

            # The same tests gate every daily run, so a profile that fails them is never committed.
            # They are offline tests and expect no Gemini key, so it is removed from their environment.
            env -u GEMINI_API_KEY -u GEMINI_MODEL \
              python3 -W error::SyntaxWarning -m unittest discover -s tests -b -v

            # Only this subscriber's own two files are committed.
            git add -- "subscribers/${SUB_ID}.json" "cvs/${SUB_ID}.md"
            if git diff --staged --quiet; then
              echo "Subscriber profile unchanged in repository."
              done_as="unchanged"
              break
            fi

            git commit -m "feat(onboard): register subscriber ${SUB_ID} in Jobs Sentinel"
            if git push origin "HEAD:$BRANCH"; then
              echo "Subscriber ${SUB_ID} committed & pushed cleanly on attempt #$attempt."
              done_as="pushed"
              break
            fi

            echo "Push attempt #$attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          if [ -z "$done_as" ]; then
            echo "::error::Could not push onboarded subscriber after 4 attempts."
            exit 1
          fi
          # Written once, after the last attempt, so later steps see the id that was really committed
          # (a retry can change it when another sign-up took the same id in the meantime).
          echo "subscriber_id=$SUB_ID" >> "$GITHUB_OUTPUT"

      - name: Send professional confirmation email from Lucy
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESULT_JSON: ${{ steps.register.outputs.result_json }}
        run: python3 onboard_subscriber.py --send-confirmation-from "$RESULT_JSON"

      - name: Optional immediate first match briefing
        if: ${{ inputs.send_initial_matches == true || github.event.client_payload.send_initial_matches == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SUB_ID: ${{ steps.register.outputs.subscriber_id }}
        run: |
          # Start the normal daily workflow for this one subscriber instead of fetching here.
          # That run sits in the daily concurrency group and uses its own commit step, so the
          # shared state file is only ever written from one place.
          gh workflow run main.yml --ref "$BRANCH" -f subscriber="$SUB_ID"
