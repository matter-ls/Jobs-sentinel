name: Refresh job board & send daily email

on:
  schedule:
    # Shifted to 13:17 UTC (7:17 AM CST in Guadalajara/Zapopan) to avoid top-of-the-hour queue delays.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      email_all:
        description: "Send all matching roles in email (not just newly discovered)"
        required: false
        default: true
        type: boolean
      subscriber:
        description: "Target subscriber (select 'all' to run for everyone)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lucas
          - luis
          - ewerson
          - monica
      check_only:
        description: "Only run `--check` (board health report). No emails, no commit."
        required: false
        default: false
        type: boolean

concurrency:
  group: jobs-sentinel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      # Safe fallback check: explicitly check if it's true (will skip on schedule where inputs is null)
      - name: Check every company board (check_only mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only == true }}
        run: python3 fetch_jobs.py --check

      # Safe fallback check: will run on schedule (since event is not check_only) or if manual check_only is false
      - name: Fetch jobs, tailor CVs with Gemini, and send emails
        id: refresh
        if: ${{ github.event_name == 'schedule' || inputs.check_only != true }}
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Fallback values for when 'inputs' is null (on schedule event)
          INPUT_EMAIL_ALL: ${{ inputs.email_all || 'true' }}
          INPUT_SUBSCRIBER: ${{ inputs.subscriber || 'all' }}
        run: |
          args=()
          if [ "$INPUT_EMAIL_ALL" = "true" ]; then
            args+=(--email-all)
          fi
          if [ -n "$INPUT_SUBSCRIBER" ] && [ "$INPUT_SUBSCRIBER" != "all" ]; then
            args+=(--subscriber "$INPUT_SUBSCRIBER")
          fi
          set +e
          python3 fetch_jobs.py "${args[@]}"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ -d out/cvs ] && [ -n "$(ls -A out/cvs 2>/dev/null)" ]; then
            echo "--- Generated Tailored CVs (.docx / .pdf / .html) ---"
            ls -lh out/cvs/
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi

      - name: Upload static site & tailored CVs artifact
        if: ${{ github.event_name == 'schedule' || inputs.check_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: job-board-and-tailored-cvs
          path: |
            docs/
            out/cvs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated state and static page
        if: ${{ github.event_name == 'schedule' || inputs.check_only != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state docs
          git add -A -- state docs
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update job radar state $(date -u +%F) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1

      - name: Fail workflow if any subscriber email failed
        if: ${{ steps.refresh.outputs.exit_code == '2' }}
        run: |
          echo "::error::One or more subscriber email digests failed to send (their state was rolled back for retry). Check the 'Fetch jobs' step log."
          exit 1
