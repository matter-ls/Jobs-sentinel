name: Refresh job board & send daily email

on:
  schedule:
    # Runs daily at 13:00 UTC (7:00 AM CST in Guadalajara/Zapopan; Mexico has no DST).
    # NOTE: scheduled runs only fire on the repository's default branch.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      email_all:
        description: "Send all matching roles in email (not just newly discovered)"
        required: false
        default: true
        type: boolean
      subscriber:
        description: "Optional subscriber ID (lucas, luis, or ewerson). Leave blank for all."
        required: false
        default: ""
        type: string
      check_only:
        description: "Only run `--check` (board health report). No emails, no commit."
        required: false
        default: false
        type: boolean

# Do NOT cancel an in-flight run: emails are sent before state/seen.json is committed,
# so killing a run mid-flight would cause duplicate emails on the next run.
concurrency:
  group: jobs-sentinel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check every company board (check_only mode)
        if: ${{ inputs.check_only == true }}
        run: python3 fetch_jobs.py --check

      - name: Fetch jobs, tailor CVs with Gemini, and send emails
        id: refresh
        if: ${{ inputs.check_only != true }}
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INPUT_EMAIL_ALL: ${{ inputs.email_all }}
          INPUT_SUBSCRIBER: ${{ inputs.subscriber }}
        run: |
          args=()
          if [ "$INPUT_EMAIL_ALL" = "true" ]; then
            args+=(--email-all)
          fi
          if [ -n "$INPUT_SUBSCRIBER" ] && [ "$INPUT_SUBSCRIBER" != "all" ]; then
            args+=(--subscriber "$INPUT_SUBSCRIBER")
          fi
          set +e
          python3 fetch_jobs.py "${args[@]}"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 0 = all good; 2 = board & state written, but >=1 subscriber email failed
          # (that subscriber's state was rolled back so they'll be retried next run).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi

      - name: Upload static site & tailored CVs artifact
        if: ${{ inputs.check_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: job-board-and-tailored-cvs
          path: |
            docs/
            out/cvs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated state and static page
        if: ${{ inputs.check_only != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state docs
          git add -A -- state docs
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update job radar state $(date -u +%F) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1

      - name: Fail workflow if any subscriber email failed
        if: ${{ steps.refresh.outputs.exit_code == '2' }}
        run: |
          echo "::error::One or more subscriber email digests failed to send (their state was rolled back for retry). Check the 'Fetch jobs' step log."
          exit 1
